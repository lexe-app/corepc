[package]
name = "electrsd"
version = "0.43.2"
authors = ["Riccardo Casatta <riccardo@casatta.it>"]
description = "Test harness for running Blockstream electrs with a Bitcoin Core regtest node"
repository = "https://git.rust-bitcoin.org/rust-bitcoin/corepc"
license = "MIT"
edition = "2021"
rust-version = "1.75.0"
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]
exclude = ["tests", "contrib"]

[dependencies]
bitcoind = { version = "0.43.0", path = "../bitcoind", default-features = false, features = ["32_1"] }
corepc-regtest-client = { version = "0.18.0", path = "../regtest-client" }
electrum-client = { version = "0.25.0", default-features = false }
log = { version = "0.4" }

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.25.0" }

[dev-dependencies]
env_logger = { version = "0.10" }

[build-dependencies]
anyhow = { version = "1.0.103", default-features = false, features = ["std"], optional = true }
bitcoin_hashes = { version = "0.14", optional = true }
bitreq = { version = "0.4.3", path = "../bitreq", optional = true, features = ["https"] }

[features]
# Download the pinned Blockstream electrs and Bitcoin Core binaries at build time.
download = ["anyhow", "bitcoin_hashes", "bitreq", "bitcoind/download"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.lint]
# Duplicates from build-dep/dep splits, --target=all, or upstream version conflicts.
allowed_duplicates = [
    "anyhow",           # build-dep and regular dep, same version
    "base64",           # upstream version conflicts
    "bitcoin_hashes",   # build-dep (download) and transitive dep, same version
    "bitflags",         # upstream version conflicts
    "bitreq",           # build-dep (download) and regular dep, same version
    "libc",             # same version, appears twice under --target=all
    "linux-raw-sys",    # same version, appears twice under --target=all
    "rustix",           # same version, appears twice under --target=all
    "windows-sys",      # upstream version conflicts
]
