name: electrsd

on:
  push:
    branches:
      - "lexe-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out corepc
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p electrsd

  test-downloads:
    name: Test pre-built downloads
    runs-on: ubuntu-latest
    env:
      RUST_LOG: debug

    steps:
      - name: Check out corepc
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p electrsd --features download

  test-nix:
    name: Test Nix electrs package
    runs-on: ubuntu-latest
    env:
      ELECTRSD_SKIP_DOWNLOAD: "1"
      ELECTRS_EXEC: ${{ github.workspace }}/result/bin/electrs
      RUST_LOG: debug

    steps:
      - name: Check out corepc
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build blockstream-electrs
        run: nix-build electrsd/default.nix -A blockstream-electrs --out-link result
      - run: cargo test -p electrsd --features download

  # Only formatting: clippy with `-D warnings` also lints the upstream path
  # dependencies (e.g. `bitreq`), which we don't keep warning-free.
  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out corepc
        uses: actions/checkout@v7
      - name: Read pinned nightly
        id: nightly
        run: echo "version=$(cat nightly-version)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.nightly.outputs.version }}
          components: rustfmt
      - run: cargo fmt -p electrsd --check
